<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 48" width="310" height="48" fill="none">
  <defs>
    <linearGradient id="cs-word-grad" x1="0" y1="0" x2="310" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="55%" stop-color="#5B5BF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <style>
    .word-first { font: 800 28px/1 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.04em; fill: currentColor; }
    .word-last { font: 700 28px/1 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.03em; fill: url(#cs-word-grad); }
    .word-badge { font: 700 13px/1 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; fill: #0066FF; }
  </style>
  <text x="2" y="34" class="word-first">Carlos <tspan class="word-last">Silveira</tspan></text>
  <rect x="218" y="13" width="46" height="24" rx="12" fill="url(#cs-word-grad)" fill-opacity="0.14" stroke="url(#cs-word-grad)" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="227" y="29.5" class="word-badge">.dev</text>
</svg>

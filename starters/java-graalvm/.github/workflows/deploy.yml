name: Build & Deploy Java 21 GraalVM Native Image to Spaceship

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM for JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'

      - name: Install musl toolchain & compile Native Image
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools zlib1g-dev
          javac Main.java
          native-image --no-fallback --static --libc=musl Main index.cgi
          chmod 755 index.cgi

      - name: Deploy to Spaceship server58 (/lab/__LAB_SLUG__/)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SPACESHIP_SSH_KEY }}
          REMOTE_HOST: server58.shared.spaceship.host
          REMOTE_PORT: 21098
          REMOTE_USER: bfjydpuzth
          REMOTE_DIR: /home/bfjydpuzth/carlossilveira.dev/lab/__LAB_SLUG__
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts
          ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "mkdir -p $REMOTE_DIR"
          rsync -avz --delete -e "ssh -p $REMOTE_PORT" \
            index.cgi .htaccess \
            "$REMOTE_USER@$REMOTE_HOST:$REMOTE_DIR/"
          ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "chmod 755 $REMOTE_DIR/index.cgi"

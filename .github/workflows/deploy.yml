name: Deploy Playground Hub (/lab/) to Spaceship

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync public/ to Spaceship server58 (/lab/)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SPACESHIP_SSH_KEY }}
          REMOTE_HOST: server58.shared.spaceship.host
          REMOTE_PORT: 21098
          REMOTE_USER: bfjydpuzth
          REMOTE_DIR: /home/bfjydpuzth/carlossilveira.dev/lab
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts
          ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "mkdir -p $REMOTE_DIR"
          rsync -avz \
            -e "ssh -p $REMOTE_PORT" \
            public/ "$REMOTE_USER@$REMOTE_HOST:$REMOTE_DIR/"
          ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "find $REMOTE_DIR -name '*.cgi' -exec chmod 755 {} +"
